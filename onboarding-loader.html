<!-- WebOuts Onboarding: paste into the Bricks "Code" element on webouts.com/onboarding.
     Everything loads from webouts.com (WebOuts Onboarding Relay plugin), so a client firewall
     only has to allow webouts.com. The ?t value changes every minute so a new version is never stuck in a cache. -->
<div id="wo-onboarding-root"></div>
<script>
(function () {
  var s = document.createElement('script');
  s.src = '/wp-json/webouts/v1/onboarding.js?t=' + Math.floor(Date.now() / 60000);
  document.head.appendChild(s);
})();
</script>
